[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The lower bound is set by the Greatness7/tes3 library: it requires 1.88 and edition 2024.
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
flate2 = "1"
# The pin is mandatory: the API is unstable. The main branch, not master.
# WARNING: the `tes3` crate on crates.io is a taken name, NOT this library.
tes3 = { git = "https://github.com/Greatness7/tes3", rev = "e61ad140b51d889ae5aa30914ba2a20fd51bf2e0", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# We care about the correctness of binary formats, so arithmetic and casts
# are watched separately rather than through a blanket pedantic.
cast_possible_truncation = "warn"

# Reduced debug info: line numbers are in backtraces, and target-msvc/debug
# is 2–3 times smaller. Step-by-step debugging in a debugger is inconvenient.
[profile.dev]
debug = "line-tables-only"
