# Russian documentation site (Zensical + Catppuccin theme). The English one is
# zensical.en.toml; both share the page structure, so keep the nav of the two files in step.
#
# Locally:  pip install -r docs/requirements.txt
#           python docs/gen_tables.py   — tables from data/*.tsv (before serve/build)
#           zensical serve              — preview at http://localhost:8000
#           zensical build --clean      — builds into site/ru
#           zensical serve -f zensical.en.toml -a localhost:8001   — the English site
# Publishing — .github/workflows/docs.yml (GitHub Pages).
#
# Each language lives in docs/<language>/: Russian is this file (docs/ru → site/ru), English is
# zensical.en.toml (docs/en → site/en). The language switcher leads to the root of the other
# language.

[project]
site_name = "back2mw"
site_description = "Конвертер содержимого Oblivion в формат Morrowind"
site_url = "https://gkalian.github.io/back2mw/ru/"
repo_url = "https://github.com/gkalian/back2mw"
repo_name = "gkalian/back2mw"
docs_dir = "docs/ru"
site_dir = "site/ru"
copyright = "back2mw — MIT. Elder Scrolls, Morrowind и Oblivion — товарные знаки ZeniMax Media."

nav = [
  { "О проекте" = "index.md" },
  { "Пользователю" = [
    "usage.md",
    "gui.md",
    "losses.md",
  ] },
  { "Типы записей" = [
    "types/index.md",
    { "Модели и статика" = [
      "types/stat.md",
      "types/tree.md",
      "types/gras.md",
    ] },
    { "Предметы" = [
      "types/weap.md",
      "types/ammo.md",
      "types/armo-clot.md",
      "types/misc.md",
      "types/slgm.md",
      "types/book.md",
      "types/alch-ingr.md",
      "types/appa.md",
    ] },
    { "Магия" = [
      "types/mgef.md",
      "types/ench-spel.md",
    ] },
    { "Объекты мира" = [
      "types/acti-furn.md",
      "types/door.md",
      "types/cont-flor.md",
      "types/ligh.md",
      "types/lvli.md",
    ] },
    { "Мир" = [
      "types/worldspace.md",
      "types/land.md",
      "types/regn.md",
      "types/interior.md",
      "types/refr.md",
      "types/pgrd.md",
    ] },
    { "Актёры" = [
      "types/race.md",
      "types/clas.md",
      "types/fact.md",
      "types/npc.md",
      "types/faces.md",
      "types/crea.md",
    ] },
    { "Звук, диалоги, скрипты" = [
      "types/soun.md",
      "types/dial.md",
      "types/glob.md",
      "types/scpt.md",
    ] },
    "types/not-converted.md",
  ] },
  { "Ресурсы" = [
    "resources/meshes.md",
    "resources/textures.md",
    "resources/audio.md",
  ] },
  { "Разработчику" = [
    "dev.md",
    "architecture.md",
    "pipeline.md",
    { "Форматы" = [
      "formats/tes4.md",
      "formats/tes3.md",
      "formats/nif-oblivion.md",
      "formats/spt.md",
    ] },
  ] },
]

[project.theme]
name = "catppuccin"
language = "ru"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.instant",
  "navigation.tracking",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

# The four Catppuccin flavors, cycled by the toggle.
[[project.theme.palette]]
scheme = "catppuccin-mocha"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Macchiato"

[[project.theme.palette]]
scheme = "catppuccin-macchiato"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/cloud-moon"
toggle.name = "Frappé"

[[project.theme.palette]]
scheme = "catppuccin-frappe"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/cloud-sun"
toggle.name = "Latte"

[[project.theme.palette]]
scheme = "catppuccin-latte"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Mocha"

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = true

# Mapping tables from data/*.tsv: python docs/gen_tables.py → docs/_generated/
[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs/_generated/ru"]
check_paths = true

# Language switcher. Links are relative to the language root (site/ru), so they work
# wherever the site is published.
[[project.extra.alternate]]
name = "Русский"
link = "./"
lang = "ru"

[[project.extra.alternate]]
name = "English"
link = "../en/"
lang = "en"
