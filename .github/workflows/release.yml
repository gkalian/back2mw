name: Release

# Релиз делается тегом: `git tag v0.2.0 && git push origin v0.2.0`. Версию задаёт тег, коммиты на неё
# не влияют. Собирается Windows-приложение (окно и консоль), проверяется тестами и выкладывается в
# GitHub Releases: zip с обоими exe, сами exe отдельно, контрольные суммы и список изменений —
# коммиты от предыдущего тега, сгруппированные по семантическому префиксу
# (`.github/scripts/changelog.sh`). Тег с `-` в имени (`v0.3.0-rc1`) — предрелиз.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# Нужно, чтобы создать релиз и прикрепить файлы.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Вся история с тегами: список изменений берётся от предыдущего тега.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Тесты на синтетике: игр на CI нет, и они не нужны (см. ci.yml).
      - name: Тесты
        run: cargo test --workspace --all-targets

      - name: Сборка
        run: cargo build --release -p gui -p back2mw

      - name: Упаковка
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "back2mw-$tag-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/back2mw-gui.exe "dist/$name/"
          Copy-Item target/release/back2mw.exe "dist/$name/"
          Copy-Item packaging/README.txt "dist/$name/README.txt"
          Copy-Item packaging/config.example.toml "dist/$name/config.example.toml"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/back2mw-gui.exe, target/release/back2mw.exe dist/
          $sums = foreach ($f in "$name.zip", "back2mw-gui.exe", "back2mw.exe") {
            "$((Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $sums | Out-File -Encoding ascii dist/SHA256SUMS.txt
          $sums

      - name: Список изменений
        shell: bash
        run: |
          bash .github/scripts/changelog.sh "${{ github.ref_name }}" > dist/notes.md
          cat >> dist/notes.md <<'EOF'

          ---

          **Files:** `back2mw-…-windows-x64.zip` — the window and the console with a README and a sample
          config; `back2mw-gui.exe`, `back2mw.exe` — the same programs on their own; `SHA256SUMS.txt` —
          checksums.
          EOF
          cat dist/notes.md

      # `gh` есть на всех раннерах GitHub; отдельное действие для релиза не нужно.
      - name: Публикация релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "back2mw-$tag-windows-x64"
          $extra = @()
          if ($tag -match '-') { $extra += "--prerelease" }
          gh release create $tag `
            "dist/$name.zip" dist/back2mw-gui.exe dist/back2mw.exe dist/SHA256SUMS.txt `
            --title "back2mw $tag" --notes-file dist/notes.md @extra
