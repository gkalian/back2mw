name: Release

# A release is made by a tag: `git tag v0.2.0 && git push origin v0.2.0`. The version is set by the tag, commits
# do not affect it. The Windows application (window and console) is built, checked by the tests and published to
# GitHub Releases: a zip with both exes, the exes themselves separately, checksums and a changelog —
# commits since the previous tag, grouped by semantic prefix
# (`.github/scripts/changelog.sh`). A tag with `-` in the name (`v0.3.0-rc1`) is a pre-release.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# Needed to create a release and attach files.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The whole history with tags: the changelog is taken from the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tests on synthetic data: there are no games on CI, and they are not needed (see ci.yml).
      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --release -p gui -p back2mw

      - name: Packaging
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "back2mw-$tag-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/back2mw-gui.exe "dist/$name/"
          Copy-Item target/release/back2mw.exe "dist/$name/"
          Copy-Item packaging/README.txt "dist/$name/README.txt"
          Copy-Item packaging/config.example.toml "dist/$name/config.example.toml"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/back2mw-gui.exe, target/release/back2mw.exe dist/
          $sums = foreach ($f in "$name.zip", "back2mw-gui.exe", "back2mw.exe") {
            "$((Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $sums | Out-File -Encoding ascii dist/SHA256SUMS.txt
          $sums

      - name: Changelog
        shell: bash
        run: |
          bash .github/scripts/changelog.sh "${{ github.ref_name }}" > dist/notes.md
          cat >> dist/notes.md <<'EOF'

          ---

          **Files:** `back2mw-…-windows-x64.zip` — the window and the console with a README and a sample
          config; `back2mw-gui.exe`, `back2mw.exe` — the same programs on their own; `SHA256SUMS.txt` —
          checksums.
          EOF
          cat dist/notes.md

      # `gh` is on all GitHub runners; a separate action for the release is not needed.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "back2mw-$tag-windows-x64"
          $extra = @()
          if ($tag -match '-') { $extra += "--prerelease" }
          gh release create $tag `
            "dist/$name.zip" dist/back2mw-gui.exe dist/back2mw.exe dist/SHA256SUMS.txt `
            --title "back2mw $tag" --notes-file dist/notes.md @extra
