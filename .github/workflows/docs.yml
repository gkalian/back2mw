name: Docs

# Zensical site → GitHub Pages. In the repository settings: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "zensical.en.toml"
      - "data/*.tsv"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      # Each language is its own build in site/<language>; the root has a redirect to Russian.
      - run: python docs/gen_tables.py
      - run: zensical build --clean
      - run: zensical build --clean -f zensical.en.toml
      - run: cp docs/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
