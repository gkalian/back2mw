name: CI

# Only on changes to the code and to what the code and tests read (docs/notes_en.tsv is embedded into
# transform: the English reasons for dropped effects). The documentation is built by its own workflow
# (docs.yml), the release by tag (release.yml). `branches` is needed so that pushing a tag does not run CI
# again: the release runs the tests itself. The path lists of push and pull_request must match.
on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "data/**"
      - "docs/notes_en.tsv"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "data/**"
      - "docs/notes_en.tsv"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # The interface is built and checked on Windows (the job below): on Linux it needs the system
        # window libraries, and the program's target platform is Windows only.
        run: cargo clippy --workspace --exclude gui --all-targets --all-features -- -D warnings

      # A tool, not the game: `esmtool` is an independent TES3 reader that
      # checks our own output. `command -v` is here on purpose —
      # if the package stops installing it, the step must fail rather than let the tests
      # silently skip the check.
      - name: esmtool from OpenMW
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmw
          command -v esmtool

      # The tests deliberately do not require installed games: everything checked
      # is built on synthetic data. This is what the reference cannot do —
      # its tests ask for Oblivion.esm, and CI does not run them.
      - name: Tests
        env:
          BACK2MW_REQUIRE_ESMTOOL: 1
        run: cargo test --workspace --exclude gui --all-targets

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for the interface
        run: cargo clippy -p gui -p back2mw --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p gui -p back2mw --all-targets
