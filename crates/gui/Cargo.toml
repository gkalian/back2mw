[package]
name = "gui"
description = "Graphical interface of back2mw (Windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "back2mw-gui"
path = "src/main.rs"

[dependencies]
# Message language: shared by all crates, has no dependencies itself.
lang = { path = "../lang" }
back2mw = { path = "../back2mw" }
# The interface and the folder picker. Both are MIT/Apache; at the owner's explicit request (a graphical application).
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", default-features = false }

[lints]
workspace = true
