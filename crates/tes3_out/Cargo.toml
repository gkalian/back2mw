[package]
name = "tes3_out"
description = "Output in the TES3 format. The only place that knows the Morrowind byte layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Message language: shared by all crates, has no dependencies itself.
lang = { path = "../lang" }
# Pinned through the workspace (decision D4 in docs/en/architecture.md).
# Pinning the commit is mandatory: the library's README warns outright that the API
# is unstable. WARNING: the `tes3` crate on crates.io is NOT this library.
tes3 = { workspace = true, features = ["esp", "bsa"] }

[lints]
workspace = true
